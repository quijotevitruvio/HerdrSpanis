name: Compilar y Publicar Releases Multiplataforma (Windows, Linux, macOS)

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Tag de release en GitHub (ej: v0.9.5-espanol)'
        required: false
        default: 'v0.9.5-espanol'
  schedule:
    - cron: '0 4 * * 1' # Cada lunes a las 04:00 UTC

permissions:
  contents: write

jobs:
  build-windows:
    name: Compilar Windows (x86_64)
    runs-on: windows-latest
    steps:
      - name: Checkout HerdrSpanis
        uses: actions/checkout@v4

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Descargar e Instalar Zig 0.16.0
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://ziglang.org/download/0.16.0/zig-x86_64-windows-0.16.0.zip" -OutFile "$env:TEMP\zig.zip"
          Expand-Archive -Path "$env:TEMP\zig.zip" -DestinationPath "$env:RUNNER_TEMP\zig" -Force
          $extractedDir = Get-ChildItem "$env:RUNNER_TEMP\zig" -Directory | Select-Object -First 1
          echo $extractedDir.FullName >> $env:GITHUB_PATH
          & "$($extractedDir.FullName)\zig.exe" version

      - name: Clonar código upstream de Herdr
        run: |
          git clone --depth 1 --branch master https://github.com/herdrdev/herdr.git herdr-upstream

      - name: Aplicar Parche en Español
        run: |
          cd herdr-upstream
          git apply --reject --whitespace=fix ..\patches\v0.9.5-espanol.patch || true

      - name: Compilar Binario Windows
        run: |
          cd herdr-upstream
          cargo build --release --bin herdr
          copy target\release\herdr.exe ..\herdr-es.exe

      - name: Subir artefacto Windows
        uses: actions/upload-artifact@v4
        with:
          name: herdr-windows
          path: herdr-es.exe

  build-linux:
    name: Compilar Linux (x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout HerdrSpanis
        uses: actions/checkout@v4

      - name: Instalar Dependencias Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libfontconfig1-dev libfreetype6-dev xz-utils

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Descargar e Instalar Zig 0.16.0
        run: |
          curl -fsSL https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz | tar -xJ
          echo "$PWD/zig-x86_64-linux-0.16.0" >> $GITHUB_PATH
          $PWD/zig-x86_64-linux-0.16.0/zig version

      - name: Clonar código upstream de Herdr
        run: |
          git clone --depth 1 --branch master https://github.com/herdrdev/herdr.git herdr-upstream

      - name: Aplicar Parche en Español
        run: |
          cd herdr-upstream
          git apply --reject --whitespace=fix ../patches/v0.9.5-espanol.patch || true

      - name: Compilar Binario Linux
        run: |
          cd herdr-upstream
          cargo build --release --bin herdr
          cp target/release/herdr ../herdr-es-linux-x86_64
          cd ..
          tar -czf herdr-es-linux-x86_64.tar.gz herdr-es-linux-x86_64

      - name: Subir artefacto Linux
        uses: actions/upload-artifact@v4
        with:
          name: herdr-linux
          path: herdr-es-linux-x86_64.tar.gz

  build-macos:
    name: Compilar macOS (Apple Silicon arm64)
    runs-on: macos-latest
    steps:
      - name: Checkout HerdrSpanis
        uses: actions/checkout@v4

      - name: Instalar Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Descargar e Instalar Zig 0.16.0
        run: |
          curl -fsSL https://ziglang.org/download/0.16.0/zig-aarch64-macos-0.16.0.tar.xz | tar -xJ
          echo "$PWD/zig-aarch64-macos-0.16.0" >> $GITHUB_PATH
          $PWD/zig-aarch64-macos-0.16.0/zig version

      - name: Clonar código upstream de Herdr
        run: |
          git clone --depth 1 --branch master https://github.com/herdrdev/herdr.git herdr-upstream

      - name: Aplicar Parche en Español
        run: |
          cd herdr-upstream
          git apply --reject --whitespace=fix ../patches/v0.9.5-espanol.patch || true

      - name: Compilar Binario macOS
        run: |
          cd herdr-upstream
          cargo build --release --bin herdr --target aarch64-apple-darwin
          cp target/aarch64-apple-darwin/release/herdr ../herdr-es-macos-arm64
          cd ..
          tar -czf herdr-es-macos-arm64.tar.gz herdr-es-macos-arm64

      - name: Subir artefacto macOS
        uses: actions/upload-artifact@v4
        with:
          name: herdr-macos
          path: herdr-es-macos-arm64.tar.gz

  publish-release:
    name: Publicar Todos los Binarios en Release
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Descargar Artefactos
        uses: actions/download-artifact@v4

      - name: Organizar Archivos
        run: |
          mkdir dist
          cp herdr-windows/herdr-es.exe dist/
          cp herdr-linux/herdr-es-linux-x86_64.tar.gz dist/
          cp herdr-macos/herdr-es-macos-arm64.tar.gz dist/
          ls -lh dist/

      - name: Publicar o Actualizar Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          tag_name: ${{ github.event.inputs.version_tag || 'v0.9.5-espanol' }}
          name: Herdr en Español ${{ github.event.inputs.version_tag || 'v0.9.5' }}
          body: |
            ## 🇪🇸 Herdr en Español — Releases Multiplataforma 🚀

            Compilaciones oficiales en español para todos los sistemas operativos:

            ### 📦 Descargas Disponibles:
            * 🪟 **Windows (x64):** `herdr-es.exe`
            * 🐧 **Linux (x64):** `herdr-es-linux-x86_64.tar.gz`
            * 🍏 **macOS (Apple Silicon M1/M2/M3/M4):** `herdr-es-macos-arm64.tar.gz`

            ---
            ⭐ **Danos una estrella:** https://github.com/quijotevitruvio/HerdrSpanis  
            ☕ **Donar en PayPal:** https://paypal.me/bibliotecologo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
