id = "herdr-spanis"
name = "HerdrSpanis"
version = "0.3.0"
min_herdr_version = "0.6.0"
description = "Herdr en Español: Localización completa de interfaz, orquestación multi-agente con Hermes Auditor y tematización canónica de 24 IAs."
author = "quijotevitruvio"
repository = "https://github.com/quijotevitruvio/HerdrSpanis"
homepage = "https://github.com/quijotevitruvio/HerdrSpanis"
license = "MIT"
platforms = ["windows", "linux", "macos"]

[[startup]]
command = ["pwsh", "-NoProfile", "-File", "scripts/check-actualizacion.ps1"]

[[startup]]
command = ["pwsh", "-NoProfile", "-File", "herdr-espanol.ps1"]

[[events]]
on = "pane.created"
command = ["pwsh", "-NoProfile", "-File", "herdr-espanol.ps1"]

[[events]]
on = "pane.agent_detected"
command = ["pwsh", "-NoProfile", "-File", "herdr-espanol.ps1"]

[[events]]
on = "pane.agent_status_changed"
command = ["pwsh", "-NoProfile", "-File", "herdr-espanol.ps1"]

[[events]]
on = "tab.created"
command = ["pwsh", "-NoProfile", "-File", "herdr-espanol.ps1"]

[[actions]]
id = "traducir"
title = "Traducir paneles e iconos a Español"
description = "Aplica de inmediato las etiquetas en español y los iconos distintivos a todos los agentes activos en Herdr."
contexts = ["global", "workspace", "tab", "pane"]
command = ["pwsh", "-NoProfile", "-File", "herdr-espanol.ps1"]

[[actions]]
id = "lanzar-escuadron"
title = "Lanzar Escuadrón Multi-Agente (Antigravity + Hermes Auditor)"
description = "Despliega un panel dual con Antigravity para codificación y Hermes Agent como copiloto auditor en tiempo real."
contexts = ["global", "workspace", "tab"]
command = ["pwsh", "-NoProfile", "-File", "scripts/lanzar-agente.ps1", "-Escuadron"]

[[actions]]
id = "ayuda"
title = "Menú y Atajos en Español"
description = "Abre la guía interactiva y menú de comandos de Herdr completamente traducido al español."
contexts = ["global", "workspace", "tab", "pane"]
command = ["pwsh", "-NoProfile", "-File", "ayuda-menu.ps1"]

[[actions]]
id = "cambiar-idioma"
title = "Alternar Idioma (Español / Inglés Oficial)"
description = "Permite alternar al instante entre el binario en español o el oficial en inglés sin alterar tus configuraciones."
contexts = ["global"]
command = ["pwsh", "-NoProfile", "-File", "scripts/herdr-idioma.ps1"]

[[actions]]
id = "actualizar-es"
title = "Actualizar Herdr en Español"
description = "Detecta la versión oficial más reciente y aplica la versión en español de forma transparente."
contexts = ["global"]
command = ["pwsh", "-NoProfile", "-File", "scripts/herdr-actualizar-es.ps1"]

[[actions]]
id = "verificar-actualizaciones"
title = "Verificar Actualizaciones de Herdr en Español"
description = "Consulta la API de GitHub para verificar si existe una nueva versión de HerdrSpanis o el binario traducido."
contexts = ["global"]
command = ["pwsh", "-NoProfile", "-File", "scripts/check-actualizacion.ps1", "-CheckOnly"]

[[actions]]
id = "lanzar-agente"
title = "Lanzar Agente IA en Español"
description = "Abre un nuevo panel con tu agente de IA preferido configurado para comunicarse en español."
contexts = ["global", "workspace", "tab"]
command = ["pwsh", "-NoProfile", "-File", "scripts/lanzar-agente.ps1"]

[[panes]]
id = "menu-ayuda"
title = "Menú y Atajos Herdr (Español)"
description = "Panel emergente con la guía rápida de atajos y navegación de Herdr en español."
placement = "popup"
command = ["pwsh", "-NoProfile", "-File", "ayuda-menu.ps1"]
